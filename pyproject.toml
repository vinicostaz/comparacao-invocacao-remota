[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-remote-invocation-comparison"
version = "1.0.0"
description = "Implementacao comparavel de um servico de musicas em REST, GraphQL, SOAP e gRPC"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "pydantic==2.10.5",
  "uvicorn==0.34.0",
  "strawberry-graphql[fastapi]==0.253.1",
  "graphql-core==3.2.5",
  "spyne==2.14.0",
  "six==1.17.0",
  "lxml==5.3.0",
  "grpcio==1.70.0",
  "grpcio-tools==1.70.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

