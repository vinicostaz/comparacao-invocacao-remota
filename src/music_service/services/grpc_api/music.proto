syntax = "proto3";

package music;

message Empty {}
message IdRequest { int64 id = 1; }
message DeleteResponse { bool success = 1; }

message User {
  int64 id = 1;
  string name = 2;
  int32 age = 3;
}
message UserInput { string name = 1; int32 age = 2; }
message UpdateUserRequest { int64 id = 1; UserInput user = 2; }
message UserList { repeated User items = 1; }

message Song {
  int64 id = 1;
  string name = 2;
  string artist = 3;
}
message SongInput { string name = 1; string artist = 2; }
message UpdateSongRequest { int64 id = 1; SongInput song = 2; }
message SongList { repeated Song items = 1; }

message Playlist {
  int64 id = 1;
  int64 user_id = 2;
  string name = 3;
  repeated Song songs = 4;
}
message PlaylistInput {
  int64 user_id = 1;
  string name = 2;
  repeated int64 song_ids = 3;
}
message UpdatePlaylistRequest { int64 id = 1; PlaylistInput playlist = 2; }
message PlaylistList { repeated Playlist items = 1; }

service MusicService {
  rpc Health(Empty) returns (Empty);
  rpc ListUsers(Empty) returns (UserList);
  rpc GetUser(IdRequest) returns (User);
  rpc CreateUser(UserInput) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc DeleteUser(IdRequest) returns (DeleteResponse);

  rpc ListSongs(Empty) returns (SongList);
  rpc GetSong(IdRequest) returns (Song);
  rpc CreateSong(SongInput) returns (Song);
  rpc UpdateSong(UpdateSongRequest) returns (Song);
  rpc DeleteSong(IdRequest) returns (DeleteResponse);

  rpc ListPlaylists(Empty) returns (PlaylistList);
  rpc GetPlaylist(IdRequest) returns (Playlist);
  rpc CreatePlaylist(PlaylistInput) returns (Playlist);
  rpc UpdatePlaylist(UpdatePlaylistRequest) returns (Playlist);
  rpc DeletePlaylist(IdRequest) returns (DeleteResponse);
  rpc ListPlaylistsByUser(IdRequest) returns (PlaylistList);
  rpc ListSongsByPlaylist(IdRequest) returns (SongList);
  rpc ListPlaylistsBySong(IdRequest) returns (PlaylistList);
}

